name: Prepare 4-slide Instagram Facts carousels (no publishing)
on:
  push:
    paths:
      - ".github/instagram-fact-cards-trigger.txt"
      - "instagram_fact_slide_overrides.json"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ivory-instagram-facts-images
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install graphic backend
        run: python3 -m pip install Pillow==11.3.0
      - name: Render 15 four-slide editorial carousels
        run: python3 scripts/prepare_instagram_facts.py
      - name: Validate cards
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          cards=list(Path("instagram-media/facts").glob("fact-*.jpg"))
          assert len(cards)>=75,len(cards)
          for card in cards:
              im=Image.open(card)
              assert im.size==(1080,1350),card
              assert card.stat().st_size>30000,card
          print("Validated",len(cards),"files across 15 four-slide Instagram carousels")
          PY
      - name: Store media without touching Instagram state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram-media/facts/*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Prepare 15 four-slide Instagram Facts carousels [skip ci]"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
