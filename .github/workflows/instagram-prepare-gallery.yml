name: Prepare Instagram galleries and Reels (no publishing)
on:
  schedule:
    - cron: "20 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/month-campaign-media-test.txt"

permissions:
  contents: write

concurrency:
  group: ivory-art-instagram-prepared-assets
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install media preparation tools
        run: |
          python3 -m pip install -r admin-panel/requirements.txt
      - name: Install FFmpeg for Reel rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Generate a small batch of media
        run: python3 scripts/prepare_instagram_assets.py --limit 3
      - name: Verify Reel video and original audio streams
        run: |
          for video in instagram-media/prepared/*.mp4; do
            [ -f "$video" ] || continue
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=noprint_wrappers=1 "$video" | grep -q 'codec_name=h264'
            ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1 "$video" | grep -q 'codec_name=aac'
          done
      - name: Store stable assets without triggering publisher workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add instagram_assets.json
          if [ -d instagram-media/prepared ]; then git add -A instagram-media/prepared/; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Prepare verified Instagram multi-photo media [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
