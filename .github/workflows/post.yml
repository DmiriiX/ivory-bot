name: IVORY-ART paintings TG + MAX
on:
  schedule:
    - cron: '0 8-16 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview without sending
        type: boolean
        default: true
      force_post:
        description: Ignore time restrictions (publishes live if dry_run false)
        type: boolean
        default: false
concurrency:
  group: ivory-art-paintings-posting
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax
        run: python3 -m py_compile scripts/post_once.py
      - name: Run safety regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Trust verified Russian Root CA required by MAX API
        run: |
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
            -o /tmp/russian_trusted_root_ca.pem \
            https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt
          ACTUAL=$(openssl x509 -in /tmp/russian_trusted_root_ca.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]')
          EXPECTED=D26D2D0231B7C39F92CC738512BA54103519E4405D68B5BD703E9788CA8ECF31
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "MAX CA certificate fingerprint verification failed"
            exit 1
          fi
          sudo cp /tmp/russian_trusted_root_ca.pem /usr/local/share/ca-certificates/russian_trusted_root_ca.crt
          sudo update-ca-certificates
      - name: Publish Telegram + MAX
        env:
          BOT_KIND: paintings
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHANNEL_ID: ${{ secrets.MAX_CHANNEL_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          FORCE_POST: ${{ github.event_name == 'workflow_dispatch' && inputs.force_post && '1' || '0' }}
        run: python3 scripts/post_once.py
      - name: Persist publication state even after partial failure
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json control.json
          if ! git diff --cached --quiet; then
            git commit -m 'Save paintings publication state [skip ci]'
            git push
          fi
