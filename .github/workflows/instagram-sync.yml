name: Sync newly published paintings to Instagram via Buffer
on:
  schedule:
    # GitHub cron can be delayed. The backend reserves one feed post per
    # Moscow date and closes the evening retry window at 23:45.
    - cron: "0,15,30,45 15-20 * * 0,2,4,6"
    # The first campaign Monday is a feed day; other Mondays are harmless.
    - cron: "0,15,30,45 15-20 * * 1"
  workflow_dispatch:
  push:
    paths:
      - ".github/instagram-test-trigger.txt"

permissions:
  contents: read
  id-token: write

concurrency:
  group: ivory-art-buffer-instagram
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Let Render complete any deployment triggered by this push
        if: github.event_name == 'push'
        run: sleep 60
      - name: Authenticated Instagram sync (no API keys in Actions)
        env:
          ADMIN_URL: https://ivory-bot-h4gn.onrender.com/internal/instagram/sync
          AUDIENCE: ivory-art-instagram-sync
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          url += ("&" if "?" in url else "?") + urllib.parse.urlencode({"audience": os.environ["AUDIENCE"]})
          token_req = urllib.request.Request(
              url,
              headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]},
          )
          with urllib.request.urlopen(token_req, timeout=30) as response:
              token = json.load(response)["value"]
          sync_req = urllib.request.Request(
              os.environ["ADMIN_URL"],
              data=b"{}",
              headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(sync_req, timeout=125) as response:
              result = json.load(response)
          print("Instagram sync:", json.dumps(result, ensure_ascii=False))
          if result.get("ok") is False and result.get("enabled") is not False:
              raise SystemExit("Instagram sync requires review: " + str(result.get("reason") or "unknown"))
          PY
