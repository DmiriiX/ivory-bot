name: Collect Instagram performance metrics from Buffer
on:
  schedule:
    - cron: "40 7 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/instagram-metrics-trigger.txt"

permissions:
  contents: read
  id-token: write

concurrency:
  group: ivory-art-instagram-metrics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Allow deployment to settle after test trigger
        if: github.event_name == 'push'
        run: sleep 75
      - name: Collect read-only Buffer insights via protected Render API
        env:
          API_URL: https://ivory-bot-h4gn.onrender.com/internal/instagram/metrics
          AUDIENCE: ivory-art-instagram-sync
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          url += ("&" if "?" in url else "?") + urllib.parse.urlencode({"audience": os.environ["AUDIENCE"]})
          request = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          with urllib.request.urlopen(request, timeout=30) as response:
              token = json.load(response)["value"]
          request = urllib.request.Request(
              os.environ["API_URL"], data=b"{}", method="POST",
              headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"})
          with urllib.request.urlopen(request, timeout=180) as response:
              result = json.load(response)
          print(json.dumps(result, ensure_ascii=False))
          if not result.get("ok"):
              raise SystemExit("Instagram metric collection not successful")
          PY
