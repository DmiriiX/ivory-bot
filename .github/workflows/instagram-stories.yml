name: Instagram Ivory Art Stories (30-day campaign)
on:
  schedule:
    # 19:20 Moscow daily; backend allows only Mon/Wed/Fri 19:15 + 90 minutes
    - cron: "20 16 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ivory-art-buffer-instagram-stories
  cancel-in-progress: false

jobs:
  stories:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticated Story publishing (without Buffer API key in Actions)
        env:
          ADMIN_URL: https://ivory-bot-h4gn.onrender.com/internal/instagram/stories
          AUDIENCE: ivory-art-instagram-sync
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          url += ("&" if "?" in url else "?") + urllib.parse.urlencode({"audience": os.environ["AUDIENCE"]})
          req = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          with urllib.request.urlopen(req, timeout=30) as response:
              token = json.load(response)["value"]
          publish = urllib.request.Request(
              os.environ["ADMIN_URL"], method="POST", data=b"{}",
              headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"})
          with urllib.request.urlopen(publish, timeout=150) as response:
              result = json.load(response)
          print("Instagram Story:", json.dumps(result, ensure_ascii=False))
          if result.get("ok") is False:
              raise SystemExit("Review Story posting: " + str(result.get("reason", "unknown")))
          PY
